name: Публикация релиза

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    name: Подготовить версию и тег
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Забрать исходники
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Проверить версию
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "В main можно публиковать только стабильную SemVer-версию."
            exit 1
          fi
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Тег $TAG уже существует и указывает на другой коммит."
              exit 1
            fi
          else
            git tag -a "$TAG" -m "NetroxBot $TAG"
            git push origin "$TAG"
          fi

  images:
    name: Собрать ${{ matrix.service }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: docker/api.Dockerfile
            image: netroxbot-api
          - service: bot
            dockerfile: docker/bot.Dockerfile
            image: netroxbot-bot
          - service: dashboard
            dockerfile: docker/dashboard.Dockerfile
            image: netroxbot-dashboard

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v7

      - name: Подготовить Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Войти в GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Подготовить теги образа
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest

      - name: Собрать и опубликовать образ
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Создать GitHub Release
    needs: [prepare, images]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Забрать исходники
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Собрать описание релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq '.body' > generated-notes.md

          {
            echo "NetroxBot $RELEASE_TAG для сервера Mothers Fantastic."
            echo
            echo "Обновление устанавливается автоматически на production-сборках с включённым автообновлением."
            echo
            cat generated-notes.md
          } > release-notes.md

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "NetroxBot $RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --title "NetroxBot $RELEASE_TAG" --notes-file release-notes.md
          fi
