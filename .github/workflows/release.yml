name: Публикация релиза

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Проверить тег
    runs-on: ubuntu-latest
    steps:
      - name: Забрать исходники
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Убедиться, что релиз идёт из main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main" || {
            echo "Тег релиза должен указывать на коммит из main."
            exit 1
          }

  images:
    name: Собрать ${{ matrix.service }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: docker/api.Dockerfile
            image: netroxbot-api
          - service: bot
            dockerfile: docker/bot.Dockerfile
            image: netroxbot-bot
          - service: dashboard
            dockerfile: docker/dashboard.Dockerfile
            image: netroxbot-dashboard

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v7

      - name: Подготовить Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Войти в GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Подготовить теги образа
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Собрать и опубликовать образ
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Создать GitHub Release
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: Забрать исходники
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Собрать описание и создать релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api             --method POST             "repos/${GITHUB_REPOSITORY}/releases/generate-notes"             -f tag_name="$GITHUB_REF_NAME"             --jq '.body' > generated-notes.md

          {
            echo "NetroxBot ${GITHUB_REF_NAME} для сервера Mothers Fantastic."
            echo
            echo "Обновление устанавливается автоматически на production-сборках с включённым автообновлением."
            echo
            cat generated-notes.md
          } > release-notes.md

          gh release create "$GITHUB_REF_NAME"             --title "NetroxBot ${GITHUB_REF_NAME}"             --notes-file release-notes.md
