name: Проверка проекта

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    name: TypeScript, Prisma, PostgreSQL, backup и сборка
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://netrox_ci:netrox_ci@localhost:5432/netroxbot_ci?schema=public
      DISCORD_GUILD_ID: "100000000000000001"
      SUPERADMIN_DISCORD_ID: "100000000000000002"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: netrox_ci
          POSTGRES_PASSWORD: netrox_ci
          POSTGRES_DB: netroxbot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netrox_ci -d netroxbot_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v7

      - name: Установить pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Установить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Установить зависимости
        run: pnpm install --no-frozen-lockfile

      - name: Сгенерировать Prisma Client
        run: pnpm db:generate

      - name: Применить миграции к тестовой PostgreSQL
        run: pnpm db:deploy

      - name: Проверить TypeScript
        run: pnpm typecheck

      - name: Собрать проект
        run: pnpm build

      - name: Проверить bootstrap базы
        run: pnpm db:bootstrap

      - name: Проверить shell-скрипты
        run: |
          sh -n scripts/backup-database.sh
          sh -n scripts/restore-latest-backup.sh
          sh -n scripts/start-service.sh

      - name: Создать и проверить резервную копию
        run: |
          mkdir -p .ci-backups
          docker run --rm --network host \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=netrox_ci \
            -e POSTGRES_PASSWORD=netrox_ci \
            -e POSTGRES_DB=netroxbot_ci \
            -e BACKUP_DIR=/backups \
            -v "$PWD/scripts:/scripts:ro" \
            -v "$PWD/.ci-backups:/backups" \
            postgres:17-alpine \
            sh /scripts/backup-database.sh once

          test -n "$(find .ci-backups -maxdepth 1 -name 'netroxbot-*.dump' -print -quit)"
          test -n "$(find .ci-backups -maxdepth 1 -name 'netroxbot-*.dump.sha256' -print -quit)"

      - name: Проверить восстановление из backup
        run: |
          docker run --rm --network host \
            -e POSTGRES_HOST=127.0.0.1 \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=netrox_ci \
            -e POSTGRES_PASSWORD=netrox_ci \
            -e POSTGRES_DB=netroxbot_ci \
            -e BACKUP_DIR=/backups \
            -e CONFIRM_RESTORE=YES \
            -v "$PWD/scripts:/scripts:ro" \
            -v "$PWD/.ci-backups:/backups" \
            postgres:17-alpine \
            sh /scripts/restore-latest-backup.sh

          pnpm db:deploy
          pnpm db:bootstrap

      - name: Проверить Docker Compose
        run: |
          cp .env.example .env
          docker compose --profile backup -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.prod.yml config >/dev/null
