name: Проверка проекта

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    name: TypeScript, Prisma, PostgreSQL и сборка
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://netrox_ci:netrox_ci@localhost:5432/netroxbot_ci?schema=public
      DISCORD_GUILD_ID: "100000000000000001"
      SUPERADMIN_DISCORD_ID: "100000000000000002"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: netrox_ci
          POSTGRES_PASSWORD: netrox_ci
          POSTGRES_DB: netroxbot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netrox_ci -d netroxbot_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Забрать исходники
        uses: actions/checkout@v7

      - name: Установить pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Установить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      - name: Установить зависимости
        run: pnpm install --no-frozen-lockfile

      - name: Сгенерировать Prisma Client
        run: pnpm db:generate

      - name: Применить миграции к тестовой PostgreSQL
        run: pnpm db:deploy

      - name: Проверить TypeScript
        run: pnpm typecheck

      - name: Собрать проект
        run: pnpm build

      - name: Проверить bootstrap базы
        run: pnpm db:bootstrap

      - name: Проверить Docker Compose
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.prod.yml config >/dev/null
