name: netroxbot

services:
  api:
    image: ghcr.io/onmaynec/netroxbot-api:${NETROXBOT_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "3001:3001"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

  bot:
    image: ghcr.io/onmaynec/netroxbot-bot:${NETROXBOT_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file: .env
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      api:
        condition: service_healthy
      lavalink:
        condition: service_started

  dashboard:
    image: ghcr.io/onmaynec/netroxbot-dashboard:${NETROXBOT_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "3000:3000"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - "${BACKUP_STORAGE:-backup_data}:/backups"
      - ./scripts/backup-database.sh:/scripts/backup-database.sh:ro
      - ./scripts/restore-latest-backup.sh:/scripts/restore-latest-backup.sh:ro
    depends_on:
      api:
        condition: service_healthy
    command: ["sh", "/scripts/backup-database.sh", "loop"]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    restart: unless-stopped
    environment:
      _JAVA_OPTIONS: "-Xmx1G"
      SERVER_PORT: 2333
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD}
      SPOTIFY_ENABLED: ${SPOTIFY_ENABLED:-false}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      YANDEX_MUSIC_ENABLED: ${YANDEX_MUSIC_ENABLED:-false}
      YANDEX_MUSIC_TOKEN: ${YANDEX_MUSIC_TOKEN:-}
    volumes:
      - ./infra/lavalink/application.yml:/opt/Lavalink/application.yml
    ports:
      - "2333:2333"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["ai"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  updater:
    image: nickfedor/watchtower:1.22.3
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_POLL_INTERVAL: ${UPDATE_INTERVAL_SECONDS:-300}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
  backup_data:
  redis_data:
  ollama_data:
